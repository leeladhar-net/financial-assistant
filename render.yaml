services:
  - type: worker
    name: financial-assistant-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_polling.py
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: financial-assistant-db
          property: connectionString
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: FINNHUB_API_KEY
        sync: false

databases:
  - name: financial-assistant-db
    plan: free
